# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# We no longer need to auto-convert third-party libraries to use AndroidX, which slowed down the build
android.enableJetifier=false

# Allow Gradle to use up to 2 GB of RAM
# (1 GB provocaba "insufficient memory for the Java Runtime Environment" en builds anteriores)
org.gradle.jvmargs=-Xmx2048M

android.nonTransitiveRClass=false

# Usar el aapt2 local del Android SDK en lugar de descargarlo de Google Maven.
# Necesario porque este entorno no tiene acceso a la red y la cache local solo
# contiene aapt2 de AGP 9.4.x, no el 8.13.2 que pide este proyecto.
android.aapt2FromMavenOverride=C:/Users/jhoan/AppData/Local/Android/Sdk/build-tools/36.0.0/aapt2.exe